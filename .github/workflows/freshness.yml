name: Check review dates

on:
  schedule:
    - cron: '23 23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: content-freshness
  cancel-in-progress: false

jobs:
  review-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate content
        run: node scripts/validate-content.mjs
      - name: Report due items and maintain one review issue
        run: node scripts/check-freshness.mjs --sync-issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
