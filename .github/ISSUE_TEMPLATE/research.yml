name: New research or report
description: Suggest evidence or a counterargument to include in the map
title: "[Research] "
body:
  - type: input
    id: source
    attributes:
      label: Source URL
    validations:
      required: true
  - type: input
    id: dates
    attributes:
      label: Publication date and observation period
      description: Include what you can establish.
  - type: input
    id: location
    attributes:
      label: Related nodes or connections
  - type: textarea
    id: finding
    attributes:
      label: What was found?
      description: Which claim does this evidence support or weaken?
    validations:
      required: true
  - type: textarea
    id: limitation
    attributes:
      label: What remains unknown?
      description: Include experimental conditions, scope, limitations, and contrary results.
