name: Error or unclear explanation
description: Suggest a correction or a clearer explanation
title: "[Correction] "
body:
  - type: input
    id: location
    attributes:
      label: Item URL or ID
      placeholder: C1, C3-L, or a URL with the item open
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What needs attention?
      description: Which statement or connection seems unclear or inaccurate, and why?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested correction (optional)
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or sources, if available
      description: Include the source URL, relevant passage, supported claim, and limitations.
